name: Build Supernote Planner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify project files
        working-directory: hobo
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/example/hobonichiplanner/MainActivity.kt

      - name: Build debug APK
        working-directory: hobo
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: test -f hobo/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supernote-planner-debug-apk
          path: hobo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
