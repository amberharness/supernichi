
name: Build Supernote Planner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    name: Locate Android project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List repository files
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Root directory contents:"
          ls -la
          echo "Gradle settings files:"
          find . -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print
